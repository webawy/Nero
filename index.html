<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كل سنة وريماس طيبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #1a0b2e;
    --bg-mid: #341a52;
    --coral: #ff6f91;
    --gold: #ffc93c;
    --mint: #4ecdc4;
    --cream: #fff6ea;
    --violet-line: rgba(255,255,255,0.12);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-mid) 0%, var(--bg-deep) 60%);
    font-family: 'Tajawal', sans-serif;
    color: var(--cream);
    overflow-x: hidden;
  }

  .stage{
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px 80px;
    text-align: center;
  }

  /* rising balloons — one orchestrated load-in moment */
  .balloon{
    position: absolute;
    bottom: -140px;
    width: 46px;
    height: 58px;
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    opacity: 0;
    animation: rise 7s ease-in forwards;
  }
  .balloon::after{
    content:"";
    position:absolute;
    bottom:-22px; left:50%;
    width:1px; height:22px;
    background: rgba(255,255,255,0.35);
    transform: translateX(-50%);
  }
  .b1{ left:8%;  background: var(--coral); animation-delay: .2s; }
  .b2{ left:22%; background: var(--gold);  animation-delay: 1.1s; width:38px; height:48px;}
  .b3{ left:72%; background: var(--mint);  animation-delay: .6s; }
  .b4{ left:86%; background: var(--coral); animation-delay: 1.6s; width:34px; height:44px;}
  .b5{ left:48%; background: var(--gold);  animation-delay: 2.1s; width:40px; height:52px;}

  @keyframes rise{
    0%{ transform: translateY(0) rotate(-4deg); opacity:0; }
    8%{ opacity:0.9; }
    85%{ opacity:0.85; }
    100%{ transform: translateY(-115vh) rotate(6deg); opacity:0; }
  }

  .eyebrow-emoji{
    font-size: 34px;
    margin-bottom: 6px;
    opacity: 0;
    animation: fadeIn .8s ease-out .3s forwards;
  }

  h1{
    font-family: 'Lalezar', sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 9vw, 76px);
    line-height: 1.15;
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--gold), var(--coral) 55%, var(--mint));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation: fadeUp .9s ease-out .5s forwards;
  }

  .name{
    font-family: 'Lalezar', sans-serif;
    font-size: clamp(48px, 12vw, 96px);
    color: var(--cream);
    margin: 4px 0 18px;
    opacity: 0;
    animation: fadeUp .9s ease-out .75s forwards;
  }

  .sub{
    max-width: 480px;
    font-size: 17px;
    line-height: 1.9;
    color: rgba(255,246,234,0.78);
    margin: 0 auto 40px;
    opacity: 0;
    animation: fadeUp .9s ease-out 1s forwards;
  }

  @keyframes fadeUp{ from{opacity:0; transform: translateY(14px);} to{opacity:1; transform: translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  /* gift button */
  .gift-btn{
    position: relative;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--bg-deep);
    background: linear-gradient(90deg, var(--gold), var(--coral));
    border: none;
    padding: 16px 38px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(255,111,145,0.35);
    opacity: 0;
    animation: fadeUp .9s ease-out 1.3s forwards;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .gift-btn:hover{ transform: translateY(-3px); box-shadow: 0 12px 34px rgba(255,111,145,0.45); }
  .gift-btn:active{ transform: translateY(0); }
  .gift-btn:focus-visible{ outline: 3px solid var(--mint); outline-offset: 3px; }
  .gift-btn.hidden{ display:none; }

  /* message card */
  .card{
    max-width: 480px;
    width: 100%;
    margin-top: 8px;
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid var(--violet-line);
    border-radius: 22px;
    padding: 36px 30px 30px;
    backdrop-filter: blur(6px);
    display: none;
  }
  .card.show{
    display: block;
    animation: cardIn .6s cubic-bezier(.2,.8,.3,1.1) forwards;
  }
  @keyframes cardIn{
    from{ opacity:0; transform: scale(.92) translateY(10px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }

  .card .heart{ font-size: 26px; margin-bottom: 12px; display:block; }

  .card p{
    font-size: 18px;
    line-height: 2.1;
    margin: 0 0 20px;
    color: var(--cream);
  }

  .signature{
    font-family: 'Lalezar', sans-serif;
    font-size: 26px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--mint), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
  }

  .divider{
    width: 46px; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, var(--coral), var(--gold));
    margin: 0 auto 20px;
  }

  /* confetti burst */
  .confetti{
    position: fixed;
    top: -10px;
    width: 8px; height: 14px;
    opacity: 0;
    pointer-events: none;
  }

  footer{
    margin-top: 44px;
    font-size: 12.5px;
    color: rgba(255,246,234,0.4);
    opacity:0;
    animation: fadeIn 1s ease-out 1.5s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>
  <div class="balloon b5"></div>

  <div class="eyebrow-emoji">🎂</div>
  <h1>كل سنة وانتِ طيبة</h1>
  <div class="name">ريماس</div>
  <p class="sub">النهاردة يومك، وحابب اقولك حاجة بسيطة… اضغطي على الهدية 🎁</p>

  <button class="gift-btn" id="giftBtn">افتحي هديتك 🎁</button>

  <div class="card" id="card">
    <span class="heart">💛</span>
    <div class="divider"></div>
    <p>
      كل سنة وانتِ بخير يا ريماس، وربنا يخليكِ ويسعدك دايمًا.<br><br>
      وجودك دخل على قلبي فرحة كنت محتاجها، وحسيت إني لقيت تعويض حلو عن كل اللي فات.<br>
      يومك ده يستاهل كل حاجة حلوة، زي ما انتِ حلوة. 🌸
    </p>
    <p class="signature">Z!XO</p>
  </div>

  <footer>صُنعت بحب 💫</footer>
</div>

<script>
  const btn = document.getElementById('giftBtn');
  const card = document.getElementById('card');

  function burstConfetti(){
    const colors = ['#ff6f91', '#ffc93c', '#4ecdc4', '#fff6ea'];
    const count = 60;
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random()*100 + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
      const duration = 2.2 + Math.random()*1.6;
      const delay = Math.random()*0.4;
      const rotate = Math.random()*360;
      el.style.transform = `rotate(${rotate}deg)`;
      el.style.animation = `confettiFall ${duration}s ease-in ${delay}s forwards`;
      document.body.appendChild(el);
      setTimeout(()=> el.remove(), (duration+delay)*1000 + 200);
    }
  }

  const styleSheet = document.createElement('style');
  styleSheet.textContent = `
    @keyframes confettiFall{
      0%{ opacity:0; transform: translateY(0) rotate(0deg); }
      10%{ opacity:1; }
      100%{ opacity:0.9; transform: translateY(100vh) rotate(340deg); }
    }
  `;
  document.head.appendChild(styleSheet);

  btn.addEventListener('click', () => {
    burstConfetti();
    card.classList.add('show');
    btn.classList.add('hidden');
    card.scrollIntoView({behavior:'smooth', block:'center'});
  });
</script>

</body>
</html>
